<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- A página que o GitHub Pages mostra para um endereço que não existe. Um link de prévia de trabalho (/w/<id>) sem a página
     dele vai para o trabalho aberto no site (js/404.js); o resto mostra este recado. Os endereços começam com "/" porque
     esta página aparece em qualquer pasta. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Page not found · Henrique Rocha</title>
<script src="/js/404.js"></script>
</head>
<body>
<p>This page does not exist. <a href="/">Go to henriquerocha.dev.br</a></p>
</body>
</html>
